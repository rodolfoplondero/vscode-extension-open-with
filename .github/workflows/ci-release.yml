name: Test, package and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_marketplaces:
        description: Publish the verified package to Visual Studio Marketplace and Open VSX
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and package on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        id: package
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw 'package.json must contain a valid release version.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version."
          }
          "vsix=open-with-external-$version.vsix" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Build VSIX
        env:
          VSIX_NAME: ${{ steps.package.outputs.vsix }}
        run: npx --no-install vsce package --allow-missing-repository --out "$env:VSIX_NAME"

      - name: Verify packaged extension in isolation
        env:
          VSIX_NAME: ${{ steps.package.outputs.vsix }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $directory = Join-Path $env:RUNNER_TEMP ('verify-vsix-' + [guid]::NewGuid().ToString('N'))
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $env:GITHUB_WORKSPACE $env:VSIX_NAME), $directory)
          node test/verify-package.cjs (Join-Path $directory 'extension')

      - name: Upload installable VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ github.sha }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-${{ github.sha }}
          path: release-artifacts

      - name: Publish release and attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VSIX_NAME: ${{ needs.build.outputs.vsix }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          asset="release-artifacts/$VSIX_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$VSIX_NAME"; then
              echo "Release already contains $VSIX_NAME; preserving the existing asset."
            else
              gh release upload "$tag" "$asset"
            fi
          else
            gh release create "$tag" "$asset" --verify-tag --title "$tag" --generate-notes
          fi

  publish-vscode:
    name: Publish to Visual Studio Marketplace
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_STORES == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_marketplaces)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-${{ github.sha }}
          path: release-artifacts
      - name: Publish the verified package using Trusted Publishing
        env:
          VSIX_NAME: ${{ needs.build.outputs.vsix }}
        run: npx --no-install vsce publish --oidc --packagePath "release-artifacts/$VSIX_NAME" --skip-duplicate

  publish-openvsx:
    name: Publish to Open VSX
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_STORES == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_marketplaces)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-${{ github.sha }}
          path: release-artifacts
      - name: Publish the verified package
        env:
          VSIX_NAME: ${{ needs.build.outputs.vsix }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo 'Configure the OVSX_PAT repository secret before publishing to Open VSX.' >&2
            exit 1
          fi
          npx --no-install ovsx publish "release-artifacts/$VSIX_NAME" --skip-duplicate
